name: Monitor

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_URL: https://sentiment-analysis-icmn.onrender.com

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check health and run probes
        run: python monitoring/check_and_log.py

      - name: Commit history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitoring/history.jsonl
          git diff --staged --quiet || git commit -m "Monitor: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
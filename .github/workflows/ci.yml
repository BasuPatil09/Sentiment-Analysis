name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Download NLTK data
        run: python docker/nltk_download.py nltk_data

      - name: Run tests
        env:
          NLTK_DATA: nltk_data
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t sentiment-analysis:ci .

      - name: Start container and check health
        run: |
          docker run -d -p 5000:5000 --name ci-test sentiment-analysis:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/health; then
              echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy"
          docker logs ci-test
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f ci-test || true